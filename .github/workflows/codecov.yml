name: Code Coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [ main, dev ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so Codecov can compute the real base->head diff. With
          # the default shallow clone (fetch-depth: 1) it can't, and falls back
          # to counting every uncovered line in each touched file as "the patch"
          # — which is why a +5-line change to a 640-line file showed ~530
          # "missing" lines. Patch coverage needs the actual diff.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          # A Codecov upload/TLS outage must not fail the build — coverage is
          # still gated by Codecov's status checks and check:anon-coverage in ci.yml.
          fail_ci_if_error: false
