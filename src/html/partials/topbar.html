<!-- Topbar spans the full window, above both the rail and the panels. -->
<header class="topbar">
  <div class="topbar__brand">
    <span class="logo-tile" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="3"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <circle
          cx="12"
          cy="12"
          r="5"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <line
          x1="12"
          y1="3"
          x2="12"
          y2="7"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <line
          x1="12"
          y1="17"
          x2="12"
          y2="21"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <line
          x1="3"
          y1="12"
          x2="7"
          y2="12"
          stroke="currentColor"
          stroke-width="1.5"
        />
        <line
          x1="17"
          y1="12"
          x2="21"
          y2="12"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
    </span>
    <span class="logo-text">MICD</span>
    <h1 class="topbar__title" id="topbar-title" data-i18n="viewer.defaultTitle">
      Visualizador DICOM
    </h1>
  </div>

  <div class="topbar__actions">
    <!-- Toggle the on-image info (measurement badges, HU, "IA" tag, AI label)
         without hiding the contours themselves (US-45). -->
    <button
      class="nav-btn"
      id="btn-toggle-info"
      type="button"
      aria-pressed="true"
      data-i18n-attr="aria-label:viewer.info.hide; title:viewer.info.hide"
      aria-label="Ocultar info"
      title="Ocultar info"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </button>
    <div class="locale-switch">
      <label class="sr-only" for="locale-select" data-i18n="app.locale.label"
        >Idioma</label
      >
      <select id="locale-select" class="locale-switch__select">
        <option value="es" data-i18n="app.locale.es">Español</option>
        <option value="en" data-i18n="app.locale.en">English</option>
      </select>
    </div>
    <!-- Guided tour (TK-27): relaunch the walkthrough from any screen. -->
    <button
      class="nav-btn"
      id="btn-help"
      type="button"
      data-i18n-attr="aria-label:tour.help.label; title:tour.help.label"
      aria-label="Guided tour"
      title="Guided tour"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
    </button>

    <!-- Preguntas frecuentes (US-44): abre la pantalla de FAQ desde cualquier
         pantalla. Disponible también para invitados, como el tutorial. -->
    <button
      class="nav-btn"
      id="btn-faq"
      type="button"
      data-i18n-attr="aria-label:faq.title; title:faq.title"
      aria-label="Preguntas frecuentes"
      title="Preguntas frecuentes"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        aria-hidden="true"
      >
        <path
          d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
        />
        <line x1="8" y1="9" x2="16" y2="9" />
        <line x1="8" y1="13" x2="13" y2="13" />
      </svg>
    </button>

    <!-- Grid Layout and Sync Controls -->
    <div
      class="topbar-grid-controls"
      role="group"
      aria-label="Layout y Sincronización"
    >
      <button
        class="topbar-btn active"
        id="btn-layout-1x1"
        title="Vista simple (1x1)"
        aria-label="Vista simple 1x1"
        aria-pressed="true"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
        <span>1x1</span>
      </button>
      <button
        class="topbar-btn"
        id="btn-layout-1x2"
        title="Vista dividida (1x2)"
        aria-label="Vista dividida 1x2"
        aria-pressed="false"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="12" y1="3" x2="12" y2="21" />
        </svg>
        <span>1x2</span>
      </button>
      <button
        class="topbar-btn"
        id="btn-layout-2x2"
        title="Cuadrícula (2x2)"
        aria-label="Cuadrícula 2x2"
        aria-pressed="false"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="12" y1="3" x2="12" y2="21" />
          <line x1="3" y1="12" x2="21" y2="12" />
        </svg>
        <span>2x2</span>
      </button>
      <button
        class="topbar-btn btn-sync"
        id="btn-sync-viewports"
        title="Sincronizar Visores"
        aria-label="Sincronizar Visores"
        aria-pressed="false"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
        </svg>
        <span>Sync</span>
      </button>
    </div>
    <!-- Series navigation -->
    <div class="series-nav hidden" id="series-nav">
      <button
        class="nav-btn"
        id="nav-prev"
        data-i18n-attr="title:viewer.nav.prevTitle"
        title="Anterior (PageUp)"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <input
        type="range"
        id="nav-slider"
        class="nav-slider"
        min="0"
        max="0"
        value="0"
      />
      <span class="nav-counter" id="nav-counter">1 / 1</span>
      <button
        class="nav-btn"
        id="nav-next"
        data-i18n-attr="title:viewer.nav.nextTitle"
        title="Siguiente (PageDown)"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="9 6 15 12 9 18" />
        </svg>
      </button>
    </div>
  </div>
</header>
