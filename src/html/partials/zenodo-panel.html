<!-- Zenodo Panel -->
<aside class="zenodo-panel zenodo-panel--closed" id="zenodo-panel">
  <div
    class="zenodo-panel__resize-handle"
    id="zenodo-resize-handle"
    aria-hidden="true"
  ></div>
  <!-- Header: logo + tabs + close -->
  <div class="z-panel-header">
    <div class="z-panel-logo">
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="9" />
        <path d="M8 12h8M12 8l4 4-4 4" />
      </svg>
      <span>Zenodo</span>
    </div>
    <div class="z-tabs">
      <button
        class="z-tab z-tab--active"
        data-tab="search"
        data-i18n="common.search"
      >
        Buscar
      </button>
      <button class="z-tab" data-tab="publish" data-i18n="zenodo.tabPublish">
        Publicar
      </button>
      <button class="z-tab" data-tab="config">Config</button>
      <button class="z-tab" data-tab="logs">Logs</button>
    </div>
    <button
      class="icon-btn z-panel-close"
      id="btn-close-zenodo"
      data-i18n-attr="title:common.close"
      title="Cerrar"
    >
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <!-- Tab: Buscar -->
  <div class="z-tab-panel" id="z-tab-search">
    <div class="z-doi-bar">
      <input
        type="text"
        id="z-doi-input"
        class="z-search-input"
        data-i18n-attr="placeholder:zenodo.doiPlaceholder"
        placeholder="DOI o URL de Zenodo (ej: 10.5281/zenodo.1234567)"
        autocomplete="off"
      />
      <button
        class="btn btn--secondary btn--sm"
        id="btn-z-resolve-doi"
        data-i18n="zenodo.importByDoi"
      >
        Importar por DOI
      </button>
    </div>
    <div class="z-search-bar">
      <input
        type="text"
        id="z-search-input"
        class="z-search-input"
        data-i18n-attr="placeholder:zenodo.searchPlaceholder"
        placeholder="CT lung DICOM…"
        autocomplete="off"
      />
      <button class="btn btn--accent btn--sm" id="btn-z-search">
        <svg
          width="12"
          height="12"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <span data-i18n="common.search">Buscar</span>
      </button>
    </div>
    <div class="z-search-filters">
      <div
        class="filter-chips"
        id="z-filter-chips"
        style="border: none; padding: 0; flex-shrink: 0"
      >
        <button
          class="filter-chip filter-chip--active"
          data-type=""
          data-i18n="zenodo.fileTypeAll"
        >
          Todos
        </button>
        <button class="filter-chip" data-type="dcm">DCM</button>
        <button class="filter-chip" data-type="zip">ZIP</button>
      </div>
      <div class="z-env-toggle" id="z-env-toggle">
        <button class="z-env-btn active" data-env="sandbox">Sandbox</button>
        <button
          class="z-env-btn"
          data-env="production"
          data-i18n="zenodo.envProduction"
        >
          Producción
        </button>
      </div>
    </div>
    <div id="z-results" class="z-results">
      <div class="z-empty-state">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity="0.3"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <p data-i18n="zenodo.searchEmptyTitle">Buscá datasets</p>
        <span data-i18n="zenodo.searchEmptyHint"
          >Ingresá términos como "CT lung" o "DICOM MRI"</span
        >
      </div>
    </div>
    <div class="z-pagination">
      <button
        class="icon-btn"
        id="z-prev"
        disabled
        data-i18n-attr="title:zenodo.paginationPrev"
        title="Anterior"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
      <span id="z-pagination-info" class="z-pagination-info">—</span>
      <button
        class="icon-btn"
        id="z-next"
        disabled
        data-i18n-attr="title:zenodo.paginationNext"
        title="Siguiente"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="9 6 15 12 9 18" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Tab: Publicar -->
  <div class="z-tab-panel hidden" id="z-tab-publish">
    <div class="z-publish-scroll" id="z-publish-content">
      <div class="z-empty-state">
        <svg
          width="36"
          height="36"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity="0.35"
        >
          <rect x="3" y="3" width="18" height="18" rx="3" />
          <circle cx="12" cy="12" r="4" />
        </svg>
        <p data-i18n="zenodo.publish.selectStudyTitle">Seleccioná un estudio</p>
        <span data-i18n="zenodo.publish.selectStudyHint"
          >Cerrá este panel, hacé click en un estudio y volvé a Publicar</span
        >
      </div>
    </div>
  </div>

  <!-- Tab: Config -->
  <div class="z-tab-panel hidden" id="z-tab-config">
    <div class="z-config-scroll" id="z-config-content">
      <div class="z-empty-state">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity="0.3"
        >
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.07 4.93a10 10 0 0 0-14.14 0M4.93 19.07a10 10 0 0 0 14.14 0"
          />
        </svg>
        <span data-i18n="zenodo.config.loadHint"
          >Abrí este tab para cargar la configuración</span
        >
      </div>
    </div>
  </div>

  <!-- Tab: Logs -->
  <div class="z-tab-panel hidden" id="z-tab-logs">
    <div class="activity-log-toolbar" id="activity-filters">
      <div class="activity-log-toolbar-row">
        <span class="activity-filter-label" data-i18n="zenodo.logs.typeLabel"
          >Tipo</span
        >
        <button
          class="btn btn--secondary activity-export-btn"
          id="btn-export-activity"
          data-i18n="zenodo.logs.downloadCsv"
        >
          Descargar CSV
        </button>
      </div>
      <div class="activity-log-filters">
        <button
          class="filter-chip filter-chip--active"
          data-filter-action=""
          data-i18n="zenodo.logs.filterAll"
        >
          Todos
        </button>
        <button
          class="filter-chip"
          data-filter-action="ZENODO_STUDY_PUBLISHED,ZENODO_PUBLISH_FAILED"
          data-i18n="zenodo.logs.filterPublish"
        >
          Publicación
        </button>
        <button
          class="filter-chip"
          data-filter-action="ZENODO_IMPORT_STARTED,ZENODO_IMPORT_COMPLETED"
          data-i18n="zenodo.logs.filterImport"
        >
          Importación
        </button>
        <button
          class="filter-chip"
          data-filter-action="ZENODO_SYNC_STARTED,ZENODO_SYNC_COMPLETED,ZENODO_SYNC_FAILED"
        >
          Sync
        </button>
        <button
          class="filter-chip"
          data-filter-action="ZENODO_TOKEN_CONFIGURED,ZENODO_TOKEN_REMOVED"
        >
          Token
        </button>
      </div>
      <div class="activity-log-filters">
        <span class="activity-filter-label" data-i18n="zenodo.logs.resultLabel"
          >Resultado</span
        >
        <button
          class="filter-chip filter-chip--active"
          data-filter-result=""
          data-i18n="zenodo.logs.filterAll"
        >
          Todos
        </button>
        <button
          class="filter-chip"
          data-filter-result="success"
          data-i18n="common.success"
        >
          Éxito
        </button>
        <button
          class="filter-chip"
          data-filter-result="error"
          data-i18n="common.error"
        >
          Error
        </button>
      </div>
    </div>
    <div class="activity-log-scroll" id="activity-log-content">
      <div class="z-empty-state">
        <span data-i18n="zenodo.logs.loadHint"
          >Abrí este tab para cargar el historial</span
        >
      </div>
    </div>
  </div>
</aside>
