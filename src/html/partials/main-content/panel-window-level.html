<!-- Window Level / Presets Panel -->
<aside
  class="wl-panel"
  id="wl-panel"
  data-i18n-attr="aria-label:viewer.wl.panelTitle"
  aria-label="Ajuste de Ventana (WL/WW)"
>
  <div class="wl-header">
    <h2 data-i18n="viewer.wl.panelTitle">Ajuste de Ventana (WL/WW)</h2>
  </div>
  <div class="wl-body">
    <!-- Sliders Section -->
    <div class="wl-section">
      <div class="slider-control">
        <div class="slider-header">
          <label for="slider-ww" data-i18n="viewer.wl.widthLabel"
            >Ancho de Ventana (WW)</label
          >
          <span class="slider-val" id="val-ww">0</span>
        </div>
        <input
          type="range"
          id="slider-ww"
          class="wl-slider"
          min="1"
          max="4000"
          step="1"
          value="0"
        />
      </div>

      <div class="slider-control">
        <div class="slider-header">
          <label for="slider-wl" data-i18n="viewer.wl.levelLabel"
            >Nivel de Ventana (WL)</label
          >
          <span class="slider-val" id="val-wl">0</span>
        </div>
        <input
          type="range"
          id="slider-wl"
          class="wl-slider"
          min="-1000"
          max="3000"
          step="1"
          value="0"
        />
      </div>
    </div>

    <!-- Presets Section -->
    <div class="wl-section">
      <span class="wl-section-title" data-i18n="viewer.wl.presetsTitle"
        >Presets Predefinidos</span
      >
      <div class="preset-grid" id="preset-grid">
        <button
          type="button"
          class="btn btn--outline preset-btn"
          id="btn-preset-lung"
          data-preset="lung"
          data-i18n="viewer.wl.presetLung"
        >
          Pulmón
        </button>
        <button
          type="button"
          class="btn btn--outline preset-btn"
          id="btn-preset-bone"
          data-preset="bone"
          data-i18n="viewer.wl.presetBone"
        >
          Hueso
        </button>
        <button
          type="button"
          class="btn btn--outline preset-btn"
          id="btn-preset-soft"
          data-preset="softTissue"
          data-i18n="viewer.wl.presetSoftTissue"
        >
          Tejido Blando
        </button>
        <button
          type="button"
          class="btn btn--outline preset-btn"
          id="btn-preset-brain"
          data-preset="brain"
          data-i18n="viewer.wl.presetBrain"
        >
          Cerebro
        </button>
      </div>
    </div>
  </div>
</aside>
